name: Daily AI News

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup proxy for translation
        run: |
          echo "Checking if proxy is needed..."
          npm install

      - name: Generate daily news
        env:
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
        run: npx tsx src/index.ts

      - name: Commit and push news
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add Output/
          git diff --staged --quiet || git commit -m "Update AI News - $(date +'%Y-%m-%d')"
          git push